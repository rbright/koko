[project]
name = "koko"
version = "0.1.0"
description = "Local Kokoro-82M text-to-speech CLI"
readme = "README.md"
authors = [{ name = "Ryan Bright" }]
requires-python = "==3.13.11"
dependencies = [
  "huggingface-hub>=0.35.3",
  "kokoro==0.9.4",
  "pydantic>=2.12.4",
  "pydantic-ai>=1.62.0",
  "pydantic-settings>=2.10.1",
]

[project.scripts]
koko = "koko_cli.entrypoint:main"
koko-download-model = "koko_cli.download:main"

[dependency-groups]
dev = [
  "prek==0.3.3",
  "pytest==9.0.2",
  "ruff==0.14.13",
  "ty==0.0.14",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koko_cli"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "platform_system == 'Linux'" },
  { index = "pytorch-cpu", marker = "platform_system != 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-q"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python = ".venv"
python-version = "3.13"
root = ["src", "tests"]

[tool.ty.src]
respect-ignore-files = true
exclude = [
  "**/.git",
  "**/.venv",
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/build",
  "**/dist",
]
