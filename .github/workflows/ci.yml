name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      KOKO_CI_MODEL_DIR: ${{ runner.temp }}/koko-model

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Format Python
        run: just fmt

      - name: Format Nix
        run: just fmt-nix

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Download local model assets
        run: just download-model "$KOKO_CI_MODEL_DIR" af_heart

      - name: Verify downloaded model assets
        run: |
          ls -la "$KOKO_CI_MODEL_DIR"
          test -f "$KOKO_CI_MODEL_DIR/config.json"
          test -f "$KOKO_CI_MODEL_DIR/kokoro-v1_0.pth"
          test -f "$KOKO_CI_MODEL_DIR/voices/af_heart.pt"

      - name: Smoke E2E
        run: just smoke-e2e "$KOKO_CI_MODEL_DIR"

      - name: Nix build
        run: nix build 'path:.#koko'

      - name: Nix run --help
        run: nix run 'path:.#koko' -- --help
